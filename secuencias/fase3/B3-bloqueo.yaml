  - {regla: COM-ALTA-01, hipotesis: "Preparación: AC-0002", m: "ALTA;Mateo;{c}", espera: {status: 201, response: {cuentaId: AC-0002}}}
  - {regla: COM-DEPOSITO-01, hipotesis: "Preparación: 50000 en AC-0001", m: "DEPOSITO;AC-0001;50000;{c}",
     espera: {status: 200, response: {status: recieved, operacionId: OP-0001}}}
  - {regla: COM-TRANSFER-01, hipotesis: "Preparación: transferencia de 1000 que luego se anula", m: "TRANSFER;AC-0001;AC-0002;1000;{c}",
     espera: {status: 200, response: {status: recieved, operacionId: OP-0002}}}
  - {regla: MEM-BLOQUEO-06, hipotesis: "Rechazo 1: E506", m: "TRANSFER;AC-0001;AC-0002;150000;{c}",
     espera: {status: 422, response: {error: E506, mensaje: límite excedido}}}
  - {regla: MEM-BLOQUEO-06, hipotesis: "Rechazo 2: E507 (60000 está bajo el límite pero sobre el saldo de 49000)",
     m: "TRANSFER;AC-0001;AC-0002;60000;{c}", espera: {status: 422, response: {error: E507, mensaje: saldo insuficiente}}}
  - {regla: MEM-BLOQUEO-06, hipotesis: "Rechazo 3: E506", m: "TRANSFER;AC-0001;AC-0002;150000;{c}",
