  - {regla: MEM-BLOQUEO-13, hipotesis: "E401 no reinicia el contador: la válida da E510",
     m: "TRANSFER;AC-0003;AC-0004;100;{c}", espera: {status: 409, response: {error: E510, mensaje: cuenta bloqueada}}}
